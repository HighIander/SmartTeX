<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartTeX uninterrupted preview browser harness</title><style>.cm-scroller { height:250px; overflow:auto } .cm-content { height:1000px }</style>
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <div class="file-tree-list"><div role="treeitem" aria-label="main.tex" aria-selected="true"></div></div>
  <div id="ide-redesign-panel-source-editor">
    <div class="cm-editor"><div class="cm-scroller"><div class="cm-content" contenteditable="true"></div></div></div>
  </div>
  <output id="result" data-result="running">running</output>
  <script>
    let editorText = `\\begin{equation}\nx=y\n\\end{equation}\n${"editor text ".repeat(5000)}`;
    let cursor = editorText.length;
    const root = document.querySelector(".cm-editor");
    const content = document.querySelector(".cm-content");
    const scroller = document.querySelector(".cm-scroller");
    function doc() {
      return {
        length: editorText.length,
        lines: 2,
        toString: () => editorText,
        lineAt: () => ({ number: 2, from: 18, to: editorText.length }),
        line: () => ({ from: 18, to: editorText.length })
      };
    }
    const view = {
      contentDOM: content,
      dom: root,
      scrollDOM: scroller,
      hasFocus: true,
      state: { doc: doc(), selection: { main: { head: cursor, anchor: cursor, from: cursor, to: cursor } } },
      dispatch: () => {},
      coordsAtPos: () => ({ left: 100, right: 102, top: 100, bottom: 118 }),
      focus: () => { view.hasFocus = true; }
    };
    function updateState() {
      view.state = { doc: doc(), selection: { main: { head: cursor, anchor: cursor, from: cursor, to: cursor } } };
    }
    root.cmView = { view };
  </script>
  <script src="../interaction-tasks.js?preview-session=4"></script>
  <script src="../latex-context.js"></script>
  <script src="../page-bridge.js?preview-session=4"></script>
  <script src="../vendor/katex/katex.min.js"></script>
  <script src="../table-renderer.js"></script>
  <script src="../figure-renderer.js"></script>
  <script>globalThis.SmartTeXPopupGate = { isReady: () => true };</script>
  <script src="../popup-gate.js"></script>
  <script src="../content.js?preview-session=4"></script>
  <script>
    const result = document.querySelector('#result');
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
    const checks = [];
    const check = (name, passed) => { checks.push({ name, passed }); if (!passed) throw new Error(name); };
    const popup = () => document.querySelector('#smarttex-equation-preview');
    const visible = () => popup() && !popup().hidden && getComputedStyle(popup()).visibility === 'visible';
    const waitFor = async (predicate, name) => {
      const until = performance.now() + 5000;
      while (!predicate() && performance.now() < until) await pause(15);
      check(name, Boolean(predicate()));
    };
    const navigate = target => {
      content.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      cursor = target;
      updateState();
      content.dispatchEvent(new KeyboardEvent('keyup', { key: 'ArrowRight', bubbles: true }));
    };
    const type = text => {
      content.dispatchEvent(new KeyboardEvent('keydown', { key: text.at(-1), bubbles: true }));
      content.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: text, bubbles: true }));
      editorText = editorText.slice(0, cursor) + text + editorText.slice(cursor);
      cursor += text.length;
      updateState();
      content.dispatchEvent(new InputEvent('input', { inputType: 'insertText', data: text, bubbles: true }));
    };
    (async () => {
      content.focus();
      await pause(800);
      navigate(editorText.indexOf('x=y') + 3);
      await waitFor(visible, 'initial preview opens');
      await pause(350);
      navigate(editorText.length - 1);
      await waitFor(() => popup().hidden, 'leaving the environment closes the preview');
      const originalRender = katex.render;
      let renderCalls = 0;
      let firstReveal = null;
      let typing = false;
      let refreshesDuringTyping = 0;
      katex.render = function(...args) {
        window.SmartTeXInteractionTasks.checkpoint(0, 1);
        renderCalls += 1;
        if (typing) refreshesDuringTyping += 1;
        return originalRender.apply(this, args);
      };
      Object.defineProperty(navigator, 'scheduling', { configurable: true, value: { isInputPending: () => typing } });
      const observer = new MutationObserver(() => {
        if (!firstReveal && visible()) firstReveal = { cached: popup().dataset.smarttexOpenedFromCache, renderCalls };
      });
      observer.observe(popup(), { attributes: true, childList: true, subtree: true });
      // Change the source before the entry snapshot: the opening must still use
      // the stored version for this environment, then regenerate the new source.
      typing = true;
      navigate(editorText.indexOf('x=y') + 3);
      type('+1');
      for (let index = 0; index < 24; index += 1) {
        await pause(35);
        if (index % 2) navigate(cursor);
        else type('+1');
      }
      check('cached preview appears during uninterrupted typing', visible() && firstReveal?.cached === 'true');
      check('cache is revealed before a new KaTeX render', firstReveal.renderCalls === 0);
      check('no fresh preview render runs while typing continues', refreshesDuringTyping === 0);
      typing = false;
      await pause(600);
      const latestEquation = editorText.slice(editorText.indexOf('x=y'), editorText.indexOf('\\end{equation}')).trim();
      const renderedTex = popup().querySelector('annotation')?.textContent || '';
      check('the final preview contains the latest equation', renderedTex.includes(latestEquation));
      typing = true;
      type('+2');
      navigate(editorText.length - 1);
      await waitFor(() => popup().hidden, 'exit cancels even with input pending');
      await pause(450);
      check('cancelled work never reopens the popup', popup().hidden);
      typing = false;
      for (const kind of ['table', 'figure']) {
        editorText = kind === 'table'
          ? String.raw`\begin{table}\caption{Alpha}\begin{tabular}{c}1\\\end{tabular}\end{table}`
          : String.raw`\begin{figure}\caption{Alpha}\end{figure}`;
        navigate(editorText.indexOf('Alpha') + 5);
        await waitFor(() => visible() && popup().dataset.previewKind === kind, `${kind} preview opens`);
        for (let index = 0; index < 8; index += 1) {
          typing = true;
          type(' beta');
          await pause(40);
        }
        typing = false;
        await waitFor(() => visible() && popup().textContent.includes('Alpha' + ' beta'.repeat(8)), `${kind} catches up during caption edits`);
        editorText += '\nOutside';
        navigate(editorText.length);
        await waitFor(() => popup().hidden, `${kind} closes on exit`);
      }
      observer.disconnect();
      katex.render = originalRender;
      document.documentElement.dataset.uninterruptedPreviewTest = 'passed';
      result.textContent = JSON.stringify({ passed: true, checks, refreshesDuringTyping, firstReveal });
    })().catch(error => {
      document.documentElement.dataset.uninterruptedPreviewTest = 'failed';
      result.textContent = JSON.stringify({ passed: false, error: error.message, checks });
    });
  </script>
</body>
</html>
