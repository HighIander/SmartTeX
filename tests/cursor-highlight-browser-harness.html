<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartTeX cursor highlight browser harness</title><style>.cm-scroller { height:250px; overflow:auto } .cm-content { height:1000px }</style>
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <div class="file-tree-list"><div role="treeitem" aria-label="main.tex" aria-selected="true"></div></div>
  <div id="ide-redesign-panel-source-editor">
    <div class="cm-editor"><div class="cm-scroller"><div class="cm-content" contenteditable="true"></div></div></div>
  </div>
  <output id="result" data-result="running">running</output>
  <script>
    let editorText = `\\begin{equation}\nx=y\n\\end{equation}\nplain\n\\begin{equation}\na=b\n\\end{equation}\n${"editor text ".repeat(5000)}`;
    let cursor = editorText.length;
    const root = document.querySelector(".cm-editor");
    const content = document.querySelector(".cm-content");
    const scroller = document.querySelector(".cm-scroller");
    function doc() {
      const source = editorText;
      const starts = [0];
      for (let index = 0; index < source.length; index += 1) {
        if (source[index] === "\n") starts.push(index + 1);
      }
      const lineAt = (index) => {
        const bounded = Math.max(0, Math.min(Number(index) || 0, source.length));
        let lineIndex = starts.length - 1;
        while (lineIndex > 0 && starts[lineIndex] > bounded) lineIndex -= 1;
        const from = starts[lineIndex];
        const newline = source.indexOf("\n", from);
        return { number: lineIndex + 1, from, to: newline < 0 ? source.length : newline };
      };
      return {
        length: source.length,
        lines: starts.length,
        toString: () => source,
        sliceString: (from, to) => source.slice(from, to),
        lineAt,
        line: (number) => lineAt(starts[Math.max(0, Math.min(starts.length - 1, number - 1))])
      };
    }
    const view = {
      contentDOM: content,
      dom: root,
      scrollDOM: scroller,
      hasFocus: true,
      state: { doc: doc(), selection: { main: { head: cursor, anchor: cursor, from: cursor, to: cursor } } },
      dispatch: () => {},
      coordsAtPos: () => ({ left: 100, right: 102, top: 100, bottom: 118 }),
      focus: () => { view.hasFocus = true; }
    };
    function updateState() {
      view.state = { doc: doc(), selection: { main: { head: cursor, anchor: cursor, from: cursor, to: cursor } } };
    }
    root.cmView = { view };
  </script>
  <script src="../interaction-tasks.js?preview-session=4"></script>
  <script src="../latex-context.js"></script>
  <script src="../page-bridge.js?preview-session=4"></script>
  <script>
    const result = document.querySelector('#result');
    const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const checks = [];
    const check = (name, passed) => { checks.push({ name, passed }); if (!passed) throw new Error(name); };
    (async () => {
      await pause(1000);
      content.focus();
      await pause(100);
      const layer = document.querySelector('#smarttex-source-structure-highlights');
      check('highlights initially mounted', layer && layer.childElementCount > 0);
      const original = layer.firstChild;
      let mutations = 0;
      const observer = new MutationObserver(records => { mutations += records.length; });
      observer.observe(layer, { childList: true });
      for (const key of ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End']) {
        content.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
        cursor -= 1;
        updateState();
        content.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
        check(`${key} stays visible`, getComputedStyle(layer).visibility === 'visible');
        await pause(30);
      }
      await pause(600);
      check('stationary cursor retains highlight nodes', layer.firstChild === original && mutations === 0);
      const clickBadgeLayer = document.querySelector('#smarttex-source-number-badges');
      const clickBadgeNodes = [...clickBadgeLayer.children];
      const tasks = window.SmartTeXInteractionTasks;
      const priorityOrder = [];
      const unsubscribe = tasks.subscribe(activity => { if (activity.reason === 'pointer') priorityOrder.push('background'); });
      const previewListener = () => priorityOrder.push('preview');
      window.addEventListener('smarttex:preview-editor-state', previewListener);
      const sidebar = document.querySelector('.file-tree-list');
      for (const target of [content, sidebar]) {
        priorityOrder.length = 0;
        const token = tasks.begin('click-interruption-test');
        target.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0 }));
        check('editor/sidebar click immediately aborts an active task', tasks.shouldAbort(token));
        check('pointer hold blocks background work', !tasks.canRunLongTask({}, 60000));
        await pause(30);
        check('pointer hold does not fan out background subscribers', priorityOrder.length === 0);
        cursor = cursor === 1 ? editorText.indexOf('a=b') : 1;
        updateState();
        target.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0 }));
        tasks.end(token);
        await pause(100);
        check('cursor popup state precedes background subscribers', priorityOrder[0] === 'preview' && priorityOrder.includes('background'));
        check('clicks across environment boundaries preserve highlights', layer.firstChild === original && mutations === 0 && getComputedStyle(layer).visibility === 'visible' && !document.documentElement.hasAttribute('data-smarttex-source-overlays-pending'));
      }
      check('editor and sidebar clicks retain the label nodes', clickBadgeNodes.every((node, index) => clickBadgeLayer.children[index] === node));
      unsubscribe();
      window.removeEventListener('smarttex:preview-editor-state', previewListener);
      const popup = document.createElement('div');
      popup.id = 'smarttex-equation-preview';
      popup.setAttribute('role', 'tooltip');
      popup.style.cssText = 'position:fixed;left:20px;top:40px;width:180px;height:50px;background:white;z-index:2147483647';
      document.body.appendChild(popup);
      await pause(80);
      check('opening a SmartTeX popup preserves environment nodes', layer.firstChild === original && mutations === 0);
      popup.remove();
      await pause(80);
      check('closing a SmartTeX popup preserves environment nodes', layer.firstChild === original && mutations === 0);
      scroller.style.cssText = 'height:150px;overflow:auto';
      content.style.height = '1000px';
      view.coordsAtPos = () => ({ left: 100, right: 102, top: 100 - scroller.scrollTop, bottom: 118 - scroller.scrollTop });
      await pause(100);
      content.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      let staleScrollReveal = false;
      const scrollRevealObserver = new MutationObserver(() => {
        if (getComputedStyle(layer).visibility === 'visible' && Number(getComputedStyle(layer).opacity) > 0.01 && layer.firstChild === original) {
          staleScrollReveal = true;
        }
      });
      scrollRevealObserver.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['class', 'data-smarttex-source-overlays-pending']
      });
      scroller.scrollTop = 32;
      await pause(50);
      check('actual scroll hides highlights', getComputedStyle(layer).visibility === 'hidden');
      const mutationsAtScrollStart = mutations;
      await pause(350);
      check('scroll quiet period keeps highlights hidden', getComputedStyle(layer).visibility === 'hidden');
      check('scroll quiet period performs no highlight work', mutations === mutationsAtScrollStart);
      await pause(250);
      check('500 ms settled scroll reveals refreshed highlights', getComputedStyle(layer).visibility === 'visible' && layer.firstChild !== original);
      check('scroll never reveals the previous highlight geometry', !staleScrollReveal);
      check('updated highlights fade in for two seconds after scroll', getComputedStyle(layer).transitionDuration === '2s' && Number(getComputedStyle(layer).opacity) < 1);
      scrollRevealObserver.disconnect();
      scroller.scrollTop = 0;
      scroller.dispatchEvent(new Event('scroll', { bubbles: true }));
      await pause(600);
      view.coordsAtPos = (index) => {
        const line = editorText.slice(0, Math.max(0, index)).split('\n').length - 1;
        const top = 34 + line * 20 - scroller.scrollTop;
        return { left: 100, right: 102, top, bottom: top + 18 };
      };
      cursor = editorText.indexOf('x=y') + 1;
      updateState();
      content.dispatchEvent(new KeyboardEvent('keyup', { key: 'ArrowRight', bubbles: true }));
      await pause(180);
      const badgeLayer = document.querySelector('#smarttex-source-number-badges');
      const highlightNodes = [...layer.children];
      const badgeNodes = [...badgeLayer.children];
      const highlightGeometryBeforeTyping = highlightNodes.map(node => node.style.cssText).join('|');
      const badgeGeometryBeforeTyping = badgeNodes.map(node => node.style.cssText).join('|');
      content.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertLineBreak', data: null, bubbles: true }));
      editorText = `${editorText.slice(0, cursor)}\n${editorText.slice(cursor)}`;
      cursor += 1;
      updateState();
      content.dispatchEvent(new InputEvent('input', { inputType: 'insertLineBreak', data: null, bubbles: true }));
      await pause(50);
      check('typing closes the source overlay readiness gate', document.documentElement.dataset.smarttexSourceOverlaysPending === 'true');
      check('typing keeps old rectangles mounted without moving them', highlightNodes.every((node, index) => layer.children[index] === node) && highlightGeometryBeforeTyping === highlightNodes.map(node => node.style.cssText).join('|'));
      check('typing keeps old number badge positions frozen', badgeGeometryBeforeTyping === badgeNodes.map(node => node.style.cssText).join('|'));
      await pause(350);
      check('old environment highlights fade out during typing', Number(getComputedStyle(layer).opacity) < 1 && getComputedStyle(layer).transitionDuration === '2s');
      check('typing performs no environment geometry work', highlightNodes.every((node, index) => layer.children[index] === node) && highlightGeometryBeforeTyping === highlightNodes.map(node => node.style.cssText).join('|'));
      await pause(250);
      check('typing idle paints refreshed environment geometry before opening the gate', document.documentElement.dataset.smarttexSourceOverlaysPending !== 'true' && layer.firstChild !== highlightNodes[0]);
      check('fresh geometry fades in over two seconds', getComputedStyle(layer).transitionDuration === '2s' && Number(getComputedStyle(layer).opacity) < 1);
      await pause(2100);
      check('refreshed environments are fully visible after the fade', Number(getComputedStyle(layer).opacity) === 1);
      observer.disconnect();
      document.documentElement.dataset.cursorHighlightTest = 'passed';
      result.textContent = JSON.stringify({ passed: true, checks });
    })().catch(error => {
      document.documentElement.dataset.cursorHighlightTest = 'failed';
      result.textContent = JSON.stringify({ passed: false, error: error.message, checks });
    });
  </script>
</body>
</html>
