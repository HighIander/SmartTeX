<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartTeX citation autocomplete harness</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: #e8edf3;
      font: 14px/1.4 system-ui, sans-serif;
    }

    .file-tree-list {
      width: 240px;
      padding: 12px;
      background: #263447;
    }

    [role="treeitem"] {
      margin: 3px 0;
    }

    .item-name-button {
      width: 100%;
      padding: 6px;
      border: 0;
      color: #fff;
      background: transparent;
      text-align: left;
    }

    #citation-test-result {
      position: fixed;
      z-index: 2147483647;
      right: 12px;
      bottom: 12px;
      padding: 7px 11px;
      border-radius: 999px;
      color: #fff;
      background: #9a6700;
      font: 700 12px/1.2 system-ui, sans-serif;
    }

    #citation-test-result[data-result="passed"] {
      background: #16803b;
    }

    #citation-test-result[data-result="failed"] {
      background: #cf222e;
    }
  </style>
</head>
<body>
  <div class="file-tree-list" role="tree">
    <div role="treeitem" aria-label="main.tex" aria-selected="true">
      <button type="button" class="item-name-button"><span>main.tex</span></button>
    </div>
    <div role="treeitem" aria-label="refs.bib" aria-selected="false">
      <button type="button" class="item-name-button"><span>refs.bib</span></button>
    </div>
  </div>
  <output id="citation-test-result">Citation test running</output>

  <script>
    const REQUEST_EVENT = "smarttex:citation-editor-request";
    const RESPONSE_EVENT = "smarttex:citation-editor-response";
    const STATE_EVENT = "smarttex:editor-state";
    const storageValues = {};
    let bridgeActive = false;
    let insertedKey = "";
    let activeFile = "main.tex";
    let selectedFile = "main.tex";
    let fileSwitchTimer = null;
    let bibliographyFetches = 0;
    let fileSwitches = 0;
    let editorScreen = { pageX: 420, pageY: 280, lineHeight: 22 };
    const cursorVerticalMoves = [];
    const files = {
      "main.tex": String.raw`\documentclass{article}
\bibliography{refs}
\begin{document}
Text \cite{Klu}
\end{document}`,
      "refs.bib": String.raw`@article{Kluge2024,
  title = {A Lightweight Citation Test},
  author = {Kluge, Thomas and Lovelace, Ada},
  journal = {Journal of Browser Tests},
  volume = {7},
  pages = {12--18},
  year = {2024},
  keywords = {testing, citations}
}

@book{Einstein1916,
  title = {Relativity},
  author = {Einstein, Albert},
  year = {1916},
  publisher = {Test Press}
}`
    };
    let cursorIndex = files["main.tex"].indexOf("Klu}") + 3;

    globalThis.browser = {
      storage: {
        local: {
          async get(key) {
            return { [key]: storageValues[key] };
          },
          async set(values) {
            Object.assign(storageValues, values);
          }
        }
      }
    };

    globalThis.fetch = async (url, options = {}) => {
      bibliographyFetches += 1;
      await new Promise((resolve) => window.setTimeout(resolve, 220));
      if (!String(url).endsWith("/refs.bib")) {
        return {
          ok: false,
          status: 404,
          headers: { get() { return "text/plain"; } },
          async text() { return ""; }
        };
      }
      return {
        ok: true,
        status: 200,
        headers: { get() { return "text/plain; charset=utf-8"; } },
        async text() { return files["refs.bib"]; }
      };
    };

    function state() {
      return {
        value: files[activeFile],
        cursorIndex: activeFile === "main.tex" ? cursorIndex : 0,
        selectionFrom: activeFile === "main.tex" ? cursorIndex : 0,
        selectionTo: activeFile === "main.tex" ? cursorIndex : 0,
        screen: editorScreen,
        fileName: selectedFile,
        focused: true,
        editorKind: "harness"
      };
    }

    function emitState() {
      window.dispatchEvent(new CustomEvent(STATE_EVENT, {
        detail: JSON.stringify(state())
      }));
    }

    function selectFile(fileName) {
      fileSwitches += 1;
      selectedFile = fileName;
      document.querySelectorAll('[role="treeitem"]').forEach((item) => {
        item.setAttribute(
          "aria-selected",
          item.getAttribute("aria-label") === fileName ? "true" : "false"
        );
      });
      emitState();
      window.clearTimeout(fileSwitchTimer);
      fileSwitchTimer = window.setTimeout(() => {
        activeFile = fileName;
        emitState();
      }, 360);
    }

    document.querySelectorAll(".item-name-button").forEach((button) => {
      button.addEventListener("click", () => {
        selectFile(button.closest('[role="treeitem"]').getAttribute("aria-label"));
      });
    });

    function citationToken() {
      const value = files["main.tex"];
      const before = value.slice(0, cursorIndex);
      const match = before.match(/\\cite\s*\{([^{}]*)$/i);
      if (!match) return null;
      const argument = match[1];
      const lastComma = argument.lastIndexOf(",");
      const fragment = argument.slice(lastComma + 1);
      const start = cursorIndex - fragment.length;
      const after = value.slice(cursorIndex).match(/^[^,{}\s]*/)?.[0] || "";
      return { start, end: cursorIndex + after.length };
    }

    window.addEventListener(REQUEST_EVENT, async (event) => {
      const request = JSON.parse(event.detail);
      const response = { requestId: request.requestId, ok: true };
      if (request.type === "getState") {
        response.state = state();
      } else if (request.type === "getCoordinates") {
        response.screen = editorScreen;
      } else if (request.type === "setCitationAutocompleteActive") {
        bridgeActive = request.active === true;
        response.active = bridgeActive;
      } else if (request.type === "readProjectTextFile") {
        bibliographyFetches += 1;
        await new Promise((resolve) => window.setTimeout(resolve, 220));
        if (typeof files[request.path] === "string") {
          response.file = {
            value: files[request.path],
            fileName: request.path
          };
        } else {
          response.ok = false;
          response.error = `Missing project file ${request.path}`;
        }
      } else if (request.type === "resolveProjectFile") {
        response.file = {
          url: `https://project.test/files/${request.path}`,
          path: request.path
        };
      } else if (request.type === "moveCursorVertical") {
        cursorVerticalMoves.push(Number(request.direction) < 0 ? -1 : 1);
        response.moved = true;
      } else if (request.type === "replaceCitationToken") {
        const token = citationToken();
        if (!token) {
          response.ok = false;
          response.error = "Citation token unavailable";
        } else {
          files["main.tex"] = (
            files["main.tex"].slice(0, token.start) +
            request.text +
            files["main.tex"].slice(token.end)
          );
          cursorIndex = token.start + request.text.length;
          insertedKey = request.text;
          response.token = token;
          window.setTimeout(emitState, 0);
        }
      } else if (request.type !== "focus") {
        response.ok = false;
        response.error = `Unexpected request ${request.type}`;
      }
      window.dispatchEvent(new CustomEvent(RESPONSE_EVENT, {
        detail: JSON.stringify(response)
      }));
    });
  </script>
  <script src="../bibtex-parser.js"></script>
  <script src="../citation-autocomplete.js"></script>
  <script>
    const delay = (milliseconds) => new Promise((resolve) => {
      window.setTimeout(resolve, milliseconds);
    });

    async function waitFor(callback, message, timeout = 5000) {
      const deadline = performance.now() + timeout;
      while (performance.now() < deadline) {
        const value = callback();
        if (value) return value;
        await delay(25);
      }
      throw new Error(message);
    }

    async function runCitationTest() {
      const checks = {};
      emitState();
      const popup = await waitFor(
        () => {
          const candidate = document.querySelector("#smarttex-citation-popup");
          return candidate && !candidate.hidden ? candidate : null;
        },
        "Citation popup did not open"
      );
      checks.backgroundSpinner = Boolean(await waitFor(
        () => popup.querySelector(".smarttex-citation-list-parsing"),
        "Initial background parsing spinner did not appear"
      ));
      checks.noInitialFileSwitch = (
        activeFile === "main.tex" &&
        selectedFile === "main.tex" &&
        fileSwitches === 0
      );
      checks.promotion = (
        popup.querySelector(".smarttex-citation-promotion a")?.href ===
        "https://github.com/HighIander/Smart-Citations"
      );
      checks.nativeSuppressed = bridgeActive;
      checks.refreshButtonAtTop = Boolean(
        popup.querySelector(".smarttex-citation-header .smarttex-citation-refresh")
      );

      const suggestion = await waitFor(
        () => popup.querySelector(".smarttex-citation-item"),
        "Parsed citation suggestion did not appear",
        7000
      );
      checks.parsed = (
        suggestion.textContent.includes("A Lightweight Citation Test") &&
        suggestion.textContent.includes("Kluge2024") &&
        suggestion.textContent.includes("Thomas Kluge")
      );
      checks.backgroundInitialRead = (
        bibliographyFetches > 0 &&
        selectedFile === "main.tex" &&
        activeFile === "main.tex" &&
        fileSwitches === 0
      );
      checks.cacheSaved = Object.values(storageValues).some((value) => (
        value?.records?.length === 2 &&
        value?.files?.includes("refs.bib")
      ));

      files["main.tex"] = String.raw`\documentclass{article}
\bibliography{refs}
\begin{document}
Text \cite{KluIGNORED
\end{document}`;
      cursorIndex = files["main.tex"].indexOf(String.raw`\cite{Klu`) +
        String.raw`\cite{Klu`.length;
      emitState();
      await waitFor(
        () => popup.querySelector(".smarttex-citation-query")?.textContent ===
          "Citations matching “Klu”",
        "Open citation query included text after the cursor"
      );
      checks.openCitationUsesOnlyPrefix = true;

      files["main.tex"] = String.raw`\documentclass{article}
\bibliography{refs}
\begin{document}
Text \cite{Klu}
\end{document}`;
      cursorIndex = files["main.tex"].indexOf("Klu}") + 3;
      emitState();
      await waitFor(
        () => popup.querySelector(".smarttex-citation-query")?.textContent ===
          "Citations matching “Klu”",
        "Closed citation context did not restore"
      );

      // The active query "Klu" displays exactly one citation. Arrow keys must
      // therefore be forwarded to editor navigation rather than cycling the
      // unchanged list selection.
      document.dispatchEvent(new KeyboardEvent("keydown", {
        key: "ArrowDown",
        bubbles: true,
        cancelable: true
      }));
      document.dispatchEvent(new KeyboardEvent("keydown", {
        key: "ArrowUp",
        bubbles: true,
        cancelable: true
      }));
      await waitFor(
        () => cursorVerticalMoves.length === 2,
        "Single-result citation arrows were not forwarded to the editor"
      );
      checks.singleResultArrowNavigation = (
        cursorVerticalMoves[0] === 1 && cursorVerticalMoves[1] === -1
      );

      files["refs.bib"] = files["refs.bib"].replace(
        "A Lightweight Citation Test",
        "A Refreshed Citation Test"
      );
      popup.querySelector(".smarttex-citation-refresh").click();
      checks.refreshSpinner = Boolean(await waitFor(
        () => popup.querySelector(".smarttex-citation-list-parsing"),
        "Refresh background parsing spinner did not appear"
      ));
      const refreshedSuggestion = await waitFor(
        () => {
          const item = popup.querySelector(".smarttex-citation-item");
          return item?.textContent.includes("A Refreshed Citation Test") ? item : null;
        },
        "Refresh button did not re-parse the bibliography",
        7000
      );
      checks.refreshed = (
        refreshedSuggestion.textContent.includes("Kluge2024") &&
        bibliographyFetches >= 2 &&
        activeFile === "main.tex" &&
        selectedFile === "main.tex" &&
        fileSwitches === 0
      );

      refreshedSuggestion.click();
      await waitFor(() => insertedKey, "Citation key was not inserted");
      checks.inserted = (
        insertedKey === "Kluge2024" &&
        files["main.tex"].includes(String.raw`\cite{Kluge2024}`)
      );

      files["main.tex"] = files["main.tex"].replace(
        String.raw`\cite{Kluge2024}`,
        String.raw`\cite{Kluge2024,Ein}`
      );
      cursorIndex = files["main.tex"].indexOf(",Ein}") + 4;
      emitState();
      await waitFor(
        () => !popup.hidden,
        "Second citation context did not reopen",
        9000
      );

      const activeCitationCursor = cursorIndex;
      cursorIndex = 0;
      emitState();
      await waitFor(() => popup.hidden, "Citation popup did not close for placement test");
      checks.closedCitationListDiscardsPreviousContent = popup.querySelector(
        ".smarttex-citation-list"
      )?.childElementCount === 0;
      editorScreen = {
        pageX: 420,
        pageY: window.scrollY + window.innerHeight - 24,
        lineHeight: 22
      };
      cursorIndex = activeCitationCursor;
      emitState();
      await waitFor(() => !popup.hidden, "Low citation popup did not reopen");
      await delay(100);
      const lowCitationRect = popup.getBoundingClientRect();
      checks.lowCitationListMovesAboveAndFits = (
        popup.dataset.smarttexPlacement === "above" &&
        lowCitationRect.top >= 8 &&
        lowCitationRect.bottom <= window.innerHeight - 8 &&
        lowCitationRect.bottom < editorScreen.pageY - window.scrollY
      );

      const smartCitationsPopup = document.createElement("div");
      smartCitationsPopup.id = "ctca-popup";
      document.body.appendChild(smartCitationsPopup);
      await delay(80);
      checks.smartCitationsHandoff = popup.hidden && !bridgeActive;

      const passed = Object.values(checks).every(Boolean);
      const output = document.querySelector("#citation-test-result");
      output.dataset.result = passed ? "passed" : "failed";
      output.textContent = passed
        ? "Citation autocomplete test passed"
        : `Citation autocomplete test failed: ${JSON.stringify(checks)}`;
      document.documentElement.dataset.citationTest = passed ? "passed" : "failed";
    }

    runCitationTest().catch((error) => {
      const output = document.querySelector("#citation-test-result");
      output.dataset.result = "failed";
      output.textContent = `Citation autocomplete test failed: ${error.message}`;
      document.documentElement.dataset.citationTest = "failed";
    });
  </script>
</body>
</html>
